<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte 2 – Selección con Bounding Boxes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { display: flex; height: 100vh; background: #111; color: #eee; font-family: system-ui, sans-serif; font-size: 13px; }
  #canvas { flex: 1; display: block; }
  #panel {
    width: 270px; min-width: 270px; background: #1a1a1a;
    padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    border-left: 1px solid #333;
  }
  #panel h3 { font-size: 14px; color: #ccc; }
  #method-tag {
    display: inline-block; background: #2a5; color: #fff; border-radius: 4px;
    padding: 2px 8px; font-size: 11px;
  }
  label { display: block; margin-bottom: 4px; color: #aaa; }
  select, input[type=range] { width: 100%; margin-top: 2px; }
  select { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px; }
  .row { display: flex; gap: 6px; }
  button {
    flex: 1; padding: 5px; background: #2a2a2a; color: #ddd; border: 1px solid #444;
    border-radius: 4px; cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  button.active { background: #1a4a1a; color: #6f6; border-color: #2a5; }
  hr { border: none; border-top: 1px solid #333; }
  #stats { color: #888; font-size: 12px; }
  .slider-row { margin-bottom: 6px; }
  .slider-row span { float: right; color: #aaa; }
  #loading { position: fixed; top: 50%; left: 45%; transform: translate(-50%,-50%);
    color: #fff; font-size: 18px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="panel">
  <h3>Parte 2 – Bounding Boxes</h3>
  <div><span id="method-tag">—</span></div>
  <hr>

  <div>
    <label>Bounding Box</label>
    <select id="box-select"><option value="-1">— ninguna —</option></select>
    <div id="stats">Cargando...</div>
  </div>
  <hr>

  <div>
    <label><input type="checkbox" id="chk-wire" checked> Mostrar wireframe OBB</label>
    <label><input type="checkbox" id="chk-inside" checked> Dentro del box (verde)</label>
  </div>
  <hr>

  <div class="row">
    <button id="btn-hide">Ocultar</button>
    <button id="btn-show">Mostrar</button>
    <button id="btn-reset">Reset</button>
  </div>
  <hr>

  <div class="slider-row">
    <label>Traslación X <span id="lbl-tx">0.00</span></label>
    <input type="range" id="sl-tx" min="-3" max="3" step="0.01" value="0">
  </div>
  <div class="slider-row">
    <label>Traslación Y <span id="lbl-ty">0.00</span></label>
    <input type="range" id="sl-ty" min="-3" max="3" step="0.01" value="0">
  </div>
  <div class="slider-row">
    <label>Traslación Z <span id="lbl-tz">0.00</span></label>
    <input type="range" id="sl-tz" min="-3" max="3" step="0.01" value="0">
  </div>
  <div class="slider-row">
    <label>Escala <span id="lbl-sc">1.00</span></label>
    <input type="range" id="sl-sc" min="0.05" max="4" step="0.05" value="1">
  </div>
</div>
<div id="loading">Cargando escena…</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh, SplatLoader } from "@sparkjsdev/spark";

// ── query string ──────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const method  = params.get("method") || "center-in-box";
const plyFile = params.get("ply")    || "3dgs.ply";
const mapFile = params.get("labels") || `mapping_${method}.json`;

// ── Three.js setup ────────────────────────────────────────────────────────────
const canvas   = document.getElementById("canvas");
const W = window.innerWidth - 270;
const H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);

const scene   = new THREE.Scene();
const camera  = new THREE.PerspectiveCamera(60, W / H, 0.01, 1000);
camera.position.set(0, 1, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const spark = new SparkRenderer({ renderer });
scene.add(spark);

// overlayScene: wireframes renderizados DESPUÉS de los Gaussianos, sin limpiar color
const overlayScene = new THREE.Scene();

window.addEventListener("resize", () => {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

// ── globals ───────────────────────────────────────────────────────────────────
let splats = null;
let store  = null;
let mapping = null;
let selectedBox = -1;
const boxState = [];

const tmpC = new THREE.Vector3();
const tmpS = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const tmpCol = new THREE.Color();
const HIGHLIGHT = new THREE.Color(1, 0.08, 0.08); // rojo

// ── status ────────────────────────────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById("loading").textContent = msg;
  console.log(msg);
}

// ── load ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  setStatus(`Cargando ${mapFile}…`);
  const mappingData = await fetch(mapFile).then(r => {
    if (!r.ok) throw new Error(`No se encontró ${mapFile} (${r.status})`);
    return r.json();
  });
  mapping = mappingData;
  for (let i = 0; i < mapping.n_boxes; i++)
    boxState.push({ hidden: false, tx: 0, ty: 0, tz: 0, scale: 1 });

  // Cargar PLY via SplatLoader (patrón oficial del viewer_base)
  setStatus(`Cargando ${plyFile}…`);
  const loader = new SplatLoader();
  const packedSplats = await loader.loadAsync(plyFile, (event) => {
    if (event.type === "progress" && event.lengthComputable) {
      const pct = ((event.loaded / event.total) * 100).toFixed(0);
      setStatus(`Cargando ${plyFile}… ${pct}%`);
    }
  });

  splats = new SplatMesh({ packedSplats });
  scene.add(splats);
  console.log(`[Viewer] SplatMesh creado: ${splats.packedSplats.numSplats} splats`);

  // Leer datos originales — push en orden de iteración (= orden original del buffer)
  setStatus("Leyendo datos de Gaussianas…");
  const _cx=[],_cy=[],_cz=[],_sx=[],_sy=[],_sz=[];
  const _qw=[],_qx=[],_qy=[],_qz=[],_op=[],_cr=[],_cg=[],_cb=[];
  splats.forEachSplat((i, c, s, q, opacity, col) => {
    _cx.push(c.x); _cy.push(c.y); _cz.push(c.z);
    _sx.push(s.x); _sy.push(s.y); _sz.push(s.z);
    _qw.push(q.w); _qx.push(q.x); _qy.push(q.y); _qz.push(q.z);
    _op.push(opacity);
    _cr.push(col.r); _cg.push(col.g); _cb.push(col.b);
  });
  const N = _cx.length;
  console.log(`[Viewer] forEachSplat: ${N} splats, op[0]=${_op[0]?.toFixed(4)}, cx[0]=${_cx[0]?.toFixed(4)}`);
  store = {
    cx:new Float32Array(_cx), cy:new Float32Array(_cy), cz:new Float32Array(_cz),
    sx:new Float32Array(_sx), sy:new Float32Array(_sy), sz:new Float32Array(_sz),
    qw:new Float32Array(_qw), qx:new Float32Array(_qx),
    qy:new Float32Array(_qy), qz:new Float32Array(_qz),
    op:new Float32Array(_op),
    cr:new Float32Array(_cr), cg:new Float32Array(_cg), cb:new Float32Array(_cb),
  };

  buildUI();
  buildWireframes();
  document.getElementById("loading").style.display = "none";
}

// ── wireframes OBB (en overlayScene para renderizar sobre los Gaussianos) ─────
const wireGroup = new THREE.Group();
overlayScene.add(wireGroup);
const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));

function buildWireframes() {
  for (let i = 0; i < mapping.n_boxes; i++) {
    const box = mapping.boxes[i];
    const ax0 = new THREE.Vector3(...box.axes[0]);
    const ax1 = new THREE.Vector3(...box.axes[1]);
    const ax2 = new THREE.Vector3(...box.axes[2]);
    if (ax0.clone().cross(ax1).dot(ax2) < 0) ax2.negate();
    const wire = new THREE.LineSegments(
      edgesGeo,
      new THREE.LineBasicMaterial({ color: 0x44ff88, depthTest: false })
    );
    wire.scale.set(2*box.half_sizes[0], 2*box.half_sizes[1], 2*box.half_sizes[2]);
    wire.setRotationFromMatrix(new THREE.Matrix4().makeBasis(ax0, ax1, ax2));
    wire.position.set(...box.center);
    wire.userData.boxIdx = i;
    wireGroup.add(wire);
  }
}

function highlightWire(boxIdx) {
  wireGroup.children.forEach(w => {
    const sel = w.userData.boxIdx === boxIdx;
    w.material = new THREE.LineBasicMaterial({
      color: sel ? 0xff2222 : 0x44ff88,
      depthTest: false,
    });
  });
}

function updateWireTransform(boxIdx) {
  if (boxIdx < 0 || !mapping) return;
  const wire = wireGroup.children.find(w => w.userData.boxIdx === boxIdx);
  if (!wire) return;
  const box = mapping.boxes[boxIdx];
  const st  = boxState[boxIdx];
  wire.position.set(
    box.center[0] + st.tx,
    box.center[1] + st.ty,
    box.center[2] + st.tz
  );
  wire.scale.set(
    2 * box.half_sizes[0] * st.scale,
    2 * box.half_sizes[1] * st.scale,
    2 * box.half_sizes[2] * st.scale
  );
}

// ── modificar gaussianas del box ──────────────────────────────────────────────
function renderBox(boxIdx) {
  if (!store || !mapping || boxIdx < 0 || boxIdx >= mapping.n_boxes) return;
  if (store.op.length === 0 || !splats.packedSplats) return;
  const indices = mapping.box_to_gaussians[boxIdx];
  const i0 = indices[0];
  console.log(`[renderBox] box=${boxIdx} indices=${indices.length} i0=${i0} op0=${store.op[i0]?.toFixed(4)} cx0=${store.cx[i0]?.toFixed(4)}`);
  const st = boxState[boxIdx];
  const isSelected = (boxIdx === selectedBox);
  // centro del OBB para escalar posiciones relativas a él
  const [bx, by, bz] = mapping.boxes[boxIdx].center;
  for (const i of indices) {
    if (i >= store.op.length) continue;
    // escala las posiciones relativas al centro del box + aplica traslación
    tmpC.set(
      bx + (store.cx[i] - bx) * st.scale + st.tx,
      by + (store.cy[i] - by) * st.scale + st.ty,
      bz + (store.cz[i] - bz) * st.scale + st.tz
    );
    tmpS.set(store.sx[i] * st.scale, store.sy[i] * st.scale, store.sz[i] * st.scale);
    tmpQ.set(store.qx[i], store.qy[i], store.qz[i], store.qw[i]);
    tmpCol.setRGB(store.cr[i], store.cg[i], store.cb[i]);
    const highlighted = isSelected && document.getElementById("chk-inside").checked;
    if (highlighted) tmpCol.copy(HIGHLIGHT);
    const opacity = st.hidden ? 0 : (highlighted ? 1.0 : store.op[i]);
    splats.packedSplats.setSplat(i, tmpC, tmpS, tmpQ, opacity, tmpCol);
  }
  splats.packedSplats.needsUpdate = true;
  updateWireTransform(boxIdx);
}

// ── UI ────────────────────────────────────────────────────────────────────────
function buildUI() {
  document.getElementById("method-tag").textContent = mapping.method;
  const sel = document.getElementById("box-select");
  for (let i = 0; i < mapping.n_boxes; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `[${i}] ${mapping.boxes[i].label} (${mapping.box_to_gaussians[i].length} gs)`;
    sel.appendChild(opt);
  }
  sel.addEventListener("change", () => {
    const prev = selectedBox;
    selectedBox = parseInt(sel.value);
    if (prev >= 0) renderBox(prev);
    if (selectedBox >= 0) {
      renderBox(selectedBox);
      highlightWire(selectedBox);
      syncSliders();
      updateStats();
    } else {
      highlightWire(-1);
    }
  });
  document.getElementById("chk-wire").addEventListener("change", e => {
    wireGroup.visible = e.target.checked;
  });
  document.getElementById("chk-inside").addEventListener("change", () => {
    if (selectedBox >= 0) renderBox(selectedBox);
  });
  document.getElementById("btn-hide").addEventListener("click", () => {
    if (selectedBox < 0) return;
    boxState[selectedBox].hidden = true;
    renderBox(selectedBox);
    updateStats();
  });
  document.getElementById("btn-show").addEventListener("click", () => {
    if (selectedBox < 0) return;
    boxState[selectedBox].hidden = false;
    renderBox(selectedBox);
    updateStats();
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    if (selectedBox < 0) return;
    boxState[selectedBox] = { hidden: false, tx: 0, ty: 0, tz: 0, scale: 1 };
    renderBox(selectedBox);
    updateWireTransform(selectedBox);
    syncSliders();
    updateStats();
  });
  const slTx = document.getElementById("sl-tx");
  const slTy = document.getElementById("sl-ty");
  const slTz = document.getElementById("sl-tz");
  const slSc = document.getElementById("sl-sc");
  slTx.addEventListener("input", () => updateSlider("tx",    parseFloat(slTx.value), "lbl-tx"));
  slTy.addEventListener("input", () => updateSlider("ty",    parseFloat(slTy.value), "lbl-ty"));
  slTz.addEventListener("input", () => updateSlider("tz",    parseFloat(slTz.value), "lbl-tz"));
  slSc.addEventListener("input", () => updateSlider("scale", parseFloat(slSc.value), "lbl-sc"));
}

function updateSlider(key, val, lblId) {
  document.getElementById(lblId).textContent = val.toFixed(2);
  if (selectedBox < 0) return;
  boxState[selectedBox][key] = val;
  renderBox(selectedBox);
}

function syncSliders() {
  if (selectedBox < 0) return;
  const st = boxState[selectedBox];
  ["tx","ty","tz"].forEach((k,j) => {
    document.getElementById(`sl-t${["x","y","z"][j]}`).value = st[k];
    document.getElementById(`lbl-t${["x","y","z"][j]}`).textContent = st[k].toFixed(2);
  });
  document.getElementById("sl-sc").value = st.scale;
  document.getElementById("lbl-sc").textContent = st.scale.toFixed(2);
}

function updateStats() {
  if (selectedBox < 0) return;
  const n = mapping.box_to_gaussians[selectedBox].length;
  const st = boxState[selectedBox];
  document.getElementById("stats").textContent =
    `${n} gaussianas | ${st.hidden ? "ocultas" : "visibles"}`;
}

// ── render loop ───────────────────────────────────────────────────────────────
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  // Wireframes en overlayScene: sin limpiar color, solo depth
  if (wireGroup.visible && wireGroup.children.length > 0) {
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(overlayScene, camera);
    renderer.autoClear = true;
  }
});

// ── start ─────────────────────────────────────────────────────────────────────
loadAll().catch(err => {
  document.getElementById("loading").textContent = `Error: ${err.message}`;
  console.error(err);
});
</script>
</body>
</html>
